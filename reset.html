<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>かんよチャンネル リセット</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#FFF6D9;color:#1E2340;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box;text-align:center}
h1{font-size:26px}p{font-size:18px;line-height:1.6}a{display:inline-block;margin-top:16px;background:#FF4A3D;color:#fff;font-size:22px;font-weight:800;padding:14px 28px;border-radius:999px;text-decoration:none;border:4px solid #1E2340}</style></head>
<body><div><h1>かんよチャンネル リセット</h1><p id="msg">ふるい ほぞんを けしています…</p><a href="./" id="go" hidden>▶ かんよチャンネルを ひらく</a>
<p style="font-size:14px;color:#6A6F8C">いいね・コメントは 消えません</p></div>
<script>
(async()=>{let n=0;try{if("serviceWorker" in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs){await r.unregister();n++}}}catch(e){}
try{if(window.caches){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}
document.getElementById("msg").textContent="リセット できました！";document.getElementById("go").hidden=false})();
</script></body></html>

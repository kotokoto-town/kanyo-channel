<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
<title>かんよチャンネル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* レイアウト: 上にチャンネル看板、左(上)に大きなテレビ画面＋再生中テロップ、右(下)にカテゴリつき動画メニュー。単一テーマ（明るいおもちゃ箱） */
:root{
  --bg:#FFF6D9; --ink:#1E2340; --paper:#FFFFFF; --red:#FF4A3D; --blue:#2D6BFF; --yellow:#FFC928; --muted:#6A6F8C; --screen:#10142B;
  --display:"Dela Gothic One","Hiragino Sans",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-weight:700;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;
  background-image:radial-gradient(var(--yellow) 1.5px,transparent 1.6px);background-size:22px 22px}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:clamp(28px,6vw,44px);line-height:1;background:var(--red);color:var(--paper);padding:10px 18px 12px;border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-2deg)}
.sub{color:var(--muted);font-size:15px}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:860px){.main{grid-template-columns:1fr}}
.tv{background:var(--ink);border-radius:26px;padding:14px;box-shadow:8px 8px 0 var(--red);display:flex;flex-direction:column;gap:10px}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:var(--screen);color:var(--paper)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(16,20,43,.62);text-align:center;padding:16px}
.overlay p{font-family:var(--display);font-size:clamp(22px,4.4vw,40px);margin:0 0 6px;text-shadow:3px 3px 0 var(--ink)}
.overlay .hint{color:#DDE0F2}
.ovbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.again{font-size:17px;font-weight:800;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:8px 20px;box-shadow:4px 4px 0 #000}
.again.next{background:var(--red);color:var(--paper)}
.bar{position:absolute;left:0;right:0;bottom:0;height:9px;background:rgba(255,255,255,.18)}
.bar i{display:block;height:100%;width:0;background:var(--red)}
.ticker{height:34px;border-radius:10px;background:#000;color:var(--yellow);overflow:hidden;white-space:nowrap;font-family:var(--display);font-size:18px;line-height:34px;display:flex;align-items:center;gap:10px;padding-inline:12px}
.ticker .live{flex:none;background:var(--red);color:var(--paper);font-size:13px;line-height:1;padding:5px 8px;border-radius:6px}
.ticker .run{flex:1;min-width:0;overflow:hidden}
.ticker .run b{display:inline-block;font-weight:400;padding-left:100%;animation:run 6s linear infinite}
.ticker.stop .run b{animation:none;padding-left:0}
.tbtn{flex:none;background:transparent;border:2px solid #444;color:var(--paper);border-radius:8px;font-size:13px;padding:2px 8px}
.np{background:var(--paper);border:4px solid var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:20px}
.np h2{margin:0;font-size:clamp(18px,2.6vw,23px);line-height:1.4;text-wrap:balance}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.views{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.like,.sub-btn{display:inline-flex;align-items:center;gap:8px;font-size:19px;font-weight:800;border:4px solid var(--ink);border-radius:999px;padding:8px 18px;box-shadow:4px 4px 0 var(--ink);transition:transform .1s}
.like{background:var(--yellow);color:var(--ink)}
.sub-btn{background:var(--red);color:var(--paper)}
.sub-btn.done{background:#E7E3D4;color:var(--ink)}
.like:active,.sub-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.like:disabled{background:#E7E3D4;color:var(--muted);box-shadow:none;cursor:not-allowed}
.like .n{font-variant-numeric:tabular-nums;min-width:2ch;text-align:left}
.hint{color:var(--muted);font-size:14px}
.pop{animation:pop .35s}
form{display:flex;gap:8px}
form input{flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--bg)}
form button{font-size:17px;font-weight:800;background:var(--blue);color:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:10px 16px}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.who button{font-size:16px;font-weight:800;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:5px 16px}.who button.on{background:var(--red);color:var(--paper)}.who button[data-n="ようた"].on{background:var(--blue)}
.av.yo{background:var(--blue)}
.comments{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto}
.comments li{display:flex;gap:10px;align-items:flex-start}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--red);color:var(--paper);display:grid;place-items:center;font-size:16px;border:3px solid var(--ink)}
.bub{background:var(--bg);border-radius:4px 14px 14px 14px;padding:8px 12px;min-width:0;overflow-wrap:anywhere}
.bub small{display:block;color:var(--muted);font-size:12px}
aside{display:flex;flex-direction:column;gap:12px;min-width:0}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mhead h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.rand{font-size:15px;font-weight:800;background:var(--blue);color:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:14px;font-weight:800;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:4px 12px}
.chip.on{background:var(--ink);color:var(--yellow)}
.auto{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.auto input{width:20px;height:20px;accent-color:var(--red)}
.list{display:flex;flex-direction:column;gap:12px;max-height:min(1100px,150vh);overflow-y:auto;padding:4px 10px 10px 4px}
.card{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:8px;box-shadow:5px 5px 0 var(--ink);transition:transform .12s}
.card:hover{transform:translate(-2px,-2px)}
.card.on{box-shadow:5px 5px 0 var(--red);border-color:var(--red)}
.thumb{position:relative;aspect-ratio:16/10;border-radius:12px;display:grid;place-items:center;font-size:32px;letter-spacing:-4px}
.num{position:absolute;left:-6px;top:-8px;font-family:var(--display);font-size:13px;background:var(--ink);color:var(--yellow);min-width:30px;padding-inline:4px;height:30px;border-radius:50%;display:grid;place-items:center}
.badge{position:absolute;right:4px;bottom:4px;font-size:10px;font-weight:800;background:var(--red);color:var(--paper);padding:2px 5px;border-radius:5px}
.card .t{font-size:15px;line-height:1.45}
.card .m{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.flyzone{position:relative}
.fly{position:absolute;font-size:30px;animation:fly 1s ease-out forwards;pointer-events:none}
@keyframes run{to{transform:translateX(-100%)}}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes fly{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-120px) scale(1.4);opacity:0}}
@media(prefers-reduced-motion:reduce){.ticker .run b{animation:none;padding-left:0}}
</style>
</head>

<div id="bootErr" hidden style="margin:16px;padding:16px;background:#fff;border:4px solid #FF4A3D;border-radius:16px;font:16px/1.6 system-ui,sans-serif;color:#1E2340">うまく ひらけませんでした。<a href="reset.html" style="color:#FF4A3D;font-weight:800">ここをタップして リセット</a><br><small id="bootErrMsg" style="color:#6A6F8C"></small></div>
<script>window.addEventListener("error",function(e){var b=document.getElementById("bootErr");if(b){b.hidden=false;document.getElementById("bootErrMsg").textContent=(e.message||"")+" ("+(e.lineno||"")+")"}});</script>


<div class="wrap">
  <header>
    <div class="logo">かんよチャンネル</div>
    <div class="sub">見たい動画をタップ！音も出るよ🔊</div>
  </header>

  <div class="main">
    <section>
      <div class="tv">
        <div class="screen" id="screen">
          <canvas id="cv"></canvas>
          <div class="overlay" id="overlay"><div><p id="ovText">どれを見る？</p><div class="hint" id="ovHint">メニューからえらんでね</div>
            <div class="ovbtns"><button class="again" id="again" hidden>▶ もう一回</button><button class="again next" id="nextBtn" hidden>⏭ つぎの動画</button></div></div></div>
          <div class="bar"><i id="prog"></i></div>
        </div>
        <div class="ticker stop" id="ticker"><span class="live">LIVE</span><div class="run"><b id="tickText">かんよチャンネルへようこそ！</b></div><button class="tbtn" id="skipBtn" hidden>⏩ 15びょう すすむ</button><button class="tbtn" id="stopBtn" hidden>⏹ とめる</button><button class="tbtn" id="sound">🔊 音あり</button></div>
      </div>
      <div class="np">
        <h2 id="nowTitle">まだ動画をえらんでいません</h2>
        <div class="row"><span class="views" id="views"></span></div>
        <div class="row flyzone" id="flyzone">
          <button class="like" id="like" disabled>👍 いいね！ <span class="n" id="likeN">0</span></button>
          <button class="sub-btn" id="subBtn">🔔 チャンネル登録</button>
          <span class="hint" id="likeHint">動画を見おわると押せるよ</span>
        </div>
        <div class="who" id="who"><span class="hint">だれが書く？</span><button type="button" class="on" data-n="かんた">かんた</button><button type="button" data-n="ようた">ようた</button></div>
        <form id="form">
          <input id="cin" maxlength="60" placeholder="コメントを書いてね" autocomplete="off" disabled>
          <button id="csend" disabled>送る</button>
        </form>
        <ul class="comments" id="comments"></ul>
      </div>
    </section>

    <aside>
      <div class="mhead"><h3 id="count">動画リスト</h3><button class="rand" id="rand">🎲 ランダム</button></div>
      <div class="chips" id="chips"></div>
      <label class="auto"><input type="checkbox" id="auto"> つぎの動画を じどうで 再生</label>
      <div class="list" id="menu"></div>
    </aside>
  </div>
</div>

<script>
/* ================= 基本の道具 ================= */
const $=id=>document.getElementById(id);
const W=1600,H=900,TAU=Math.PI*2,R=Math.random,rr=(a,b)=>a+R()*(b-a);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=t=>1-Math.pow(1-clamp(t),3);
const back=t=>{t=clamp(t);const c=1.9,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const pick=a=>a[Math.floor(R()*a.length)];
const FONT='"Dela Gothic One","Hiragino Sans",sans-serif';
const cv=$("cv"),ctx=cv.getContext("2d");
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d)}
window.addEventListener("resize",resize);

/* ================= 効果音 ================= */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f1,f2,dur,type="square",vol=.12,delay=0){const a=ac();if(!a||muted)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)}
function noise(dur,vol=.3,freq=1000,delay=0,type="lowpass"){const a=ac();if(!a||muted)return;const t=a.currentTime+delay,len=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=R()*2-1;const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(a.destination);s.start(t)}
function crackle(n,gap=.09){for(let i=0;i<n;i++)noise(.05,.35,rr(2500,6000),i*gap+rr(0,.04),"bandpass")}
function fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,f,i==3?.6:.18,"square",.1,i*.16));tone(1568,1568,.5,"triangle",.08,.64)}
const SFX={
  whoosh:()=>{noise(.5,.25,1500);tone(300,900,.4,"sine",.08)},
  boing:()=>{tone(600,150,.4,"sine",.22);tone(300,700,.3,"triangle",.12,.35)},
  roar:()=>{noise(1.4,.6,400);tone(140,60,1.2,"sawtooth",.25)},
  magic:()=>{[0,.1,.2,.3,.4].forEach((d,i)=>tone(800+i*200,1600+i*200,.15,"sine",.1,d))},
  laugh:()=>{[0,.25,.5].forEach(d=>tone(170,110,.22,"square",.12,d))},
  boom:()=>{noise(2.4,.7,700);tone(140,28,1.8,"sine",.55);noise(.4,.5,5000,0,"highpass")},
  chomp:()=>{[0,.35,.7,1.05,1.4].forEach(d=>{noise(.08,.5,900,d);tone(300,200,.06,"square",.1,d)})},
  kiran:()=>{tone(2100,2100,.12,"sine",.2);tone(3150,3150,.35,"sine",.18,.1)},
  fart:()=>{tone(95,55,1.1,"sawtooth",.3);noise(1.1,.3,220)},
  boo:()=>{tone(200,700,.6,"triangle",.25);noise(.5,.3,800)},
  land:()=>{noise(.5,.6,250);tone(120,50,.4,"sine",.4)},
  splash:()=>{noise(.9,.45,1400);noise(.6,.3,4000,0,"highpass")},
  robot:()=>{[0,.12,.24,.36].forEach((d,i)=>tone(400+i*120,400+i*120,.08,"square",.1,d))},
  meow:()=>{tone(700,1100,.15,"triangle",.2);tone(1100,600,.3,"triangle",.2,.15)},
  sizzle:()=>{noise(1.6,.28,6000,0,"bandpass")},
  engine:(d=1.4)=>{tone(80,260,d,"sawtooth",.18);noise(d,.2,500)},
  rise:(d=1.6)=>{tone(90,1100,d,"sawtooth",.13)},
  beam:(d=1.2)=>{tone(1800,60,d,"sawtooth",.2);noise(d,.35,2000)},
  ice:()=>{[0,.1,.2,.3,.45].forEach(d=>tone(rr(2000,3500),rr(2500,4000),.1,"sine",.14,d));noise(.8,.2,6000,0,"highpass")},
  wind:(d=2)=>{noise(d,.4,600,0,"bandpass");tone(200,400,d,"sine",.08)},
  pop:(d=0)=>tone(500,1000,.08,"sine",.2,d)
};

/* ================= パーティクル ================= */
let parts=[],shake=0,flash=0,T=0;
function spawn(n,f){for(let i=0;i<n;i++)parts.push(f(i))}
function stepParts(dt){
  for(const q of parts){
    if(q.orb){q.a+=q.va*dt;q.r=Math.max(0,q.r-q.vr*dt);q.x=q.cx+Math.cos(q.a)*q.r;q.y=q.cy+Math.sin(q.a)*q.r*.7;if(q.r<8)q.life=0}
    else{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.g||0)*dt;if(q.drag){q.vx*=q.drag;q.vy*=q.drag}}
    q.rot=(q.rot||0)+(q.vrot||0)*dt;q.life-=dt;
  }
  parts=parts.filter(q=>q.life>0&&q.y<H+400);
  if(parts.length>700)parts.splice(0,parts.length-700);
}
function drawParts(){
  for(const q of parts){
    ctx.save();ctx.globalAlpha=clamp(q.life/q.max)*(q.alpha||1);ctx.fillStyle=q.col||"#fff";ctx.translate(q.x,q.y);ctx.rotate(q.rot||0);
    const s=q.size*(q.grow?1+(1-q.life/q.max)*q.grow:1);
    if(q.fn){ctx.globalAlpha=Math.min(1,q.life*3);q.fn(0,0,s,T)}
    else if(q.txt){ctx.font=`${s}px ${FONT}`;ctx.textAlign="center";ctx.lineWidth=s*.2;ctx.strokeStyle="#1E2340";ctx.lineJoin="round";ctx.strokeText(q.txt,0,0);ctx.fillText(q.txt,0,0)}
    else if(q.shape==="r")ctx.fillRect(-s,-s*.5,s*2,s);
    else if(q.shape==="star")star(0,0,s,s*.45,4);
    else if(q.shape==="rock"){ctx.beginPath();ctx.moveTo(-s,-s*.4);ctx.lineTo(-s*.2,-s);ctx.lineTo(s,-s*.3);ctx.lineTo(s*.6,s);ctx.lineTo(-s*.7,s*.7);ctx.closePath();ctx.fill();ctx.strokeStyle="#1E2340";ctx.lineWidth=4;ctx.stroke()}
    else{ctx.beginPath();ctx.arc(0,0,s,0,TAU);ctx.fill()}
    ctx.restore();
  }
}
function star(x,y,r1,r2,n){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=i*Math.PI/n-Math.PI/2;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath();ctx.fill()}
const CONFETTI=["#FF4A3D","#FFC928","#2D6BFF","#3FE0A0","#FF7AD9","#FFFFFF"];
function confetti(n=140){spawn(n,()=>({x:rr(0,W),y:rr(-400,-20),vx:rr(-80,80),vy:rr(150,380),g:120,life:3,max:3,size:rr(8,16),col:pick(CONFETTI),shape:"r",vrot:rr(-8,8)}))}
function sparkles(x,y,n,col="#FFF6B0",spd=500){spawn(n,()=>{const a=R()*TAU,v=rr(spd*.3,spd);return{x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,drag:.96,life:rr(.5,1.1),max:1.1,size:rr(8,20),col,shape:"star",vrot:rr(-6,6)}})}
function floatText(x,y,txt,col="#fff",size=60){spawn(1,()=>({x,y,vx:rr(-40,40),vy:-160,life:1,max:1,size,txt,col}))}

/* ================= 絵の道具 ================= */
function bgRad(c1,c2,x=W/2,y=H/2){const g=ctx.createRadialGradient(x,y,0,x,y,W*.8);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(-80,-80,W+160,H+160)}
function bgLin(c1,c2){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(-80,-80,W+160,H+160)}
const STARS=Array.from({length:120},()=>({x:R()*W,y:R()*H,s:rr(1,3.5),p:R()*TAU}));
function stars(T,alpha=1){ctx.save();ctx.fillStyle="#fff";for(const s of STARS){ctx.globalAlpha=alpha*(.4+.6*Math.abs(Math.sin(T*2+s.p)));ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,TAU);ctx.fill()}ctx.restore()}
function focus(cx,cy,n,col,alpha,inner=260){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=col;for(let i=0;i<n;i++){const a=R()*TAU,w=rr(.004,.018),r1=rr(inner,inner+220);ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);ctx.lineTo(cx+Math.cos(a-w)*1800,cy+Math.sin(a-w)*1800);ctx.lineTo(cx+Math.cos(a+w)*1800,cy+Math.sin(a+w)*1800);ctx.fill()}ctx.restore()}
function speedLines(col="rgba(255,255,255,.7)",n=26){ctx.save();ctx.fillStyle=col;for(let i=0;i<n;i++)ctx.fillRect(rr(-200,W),rr(0,H),rr(300,900),rr(3,12));ctx.restore()}

const LEGACY={thunder:["b","thunder",4],magic:["b","magic",0],legend:["b","dino",3],yakiniku:["f","tongue"],fire:["b","fire",1],ice:["b","ice",2],wind:["b","wind",0],robotwar:["b","thunder",3],rocketpunch:["b","robot",2],dinorobot:["b","dino",3],egg:["b","dino",5],volcano:["b","ice",5],rocket:["t",0,0],ufo:["t",1,1],wish:["f","tongue"],meteor:["b","gold",9],ghost:["b","magic",6],shark:["f","burger"],cat:["b","cat",0],unchi:["t",2,2],fart:["b","unchi",0],f1:["r"],ramen:["f","ramen"],pizza:["f","pizza"],cake:["f","cake"],sushi:["f","sushi"],curry:["f","curry"],burger:["f","burger"],icecream:["f","ice"],kumon:["f","tongue"],final:["b","gold",0]};

function specFor(v){if(v.spec)return v.spec;const id=v.id,p=id.split("_"),hs=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0);
  if(LEGACY[id]){const L0=LEGACY[id];if(L0[0]==="b")return{k:"b",h:HB(L0[1]),e:ENEMIES[L0[2]]};if(L0[0]==="f")return{k:"f",f:FK(L0[1])};if(L0[0]==="t")return{k:"t",v:VEHICLES[L0[1]],d:DESTS[L0[2]]};return{k:"r",rs:[RACERS[0],RACERS[1],RACERS[2]],win:RACERS[0]}}
  switch(p[0]){case"b":return{k:"b",h:HB(p[1]),e:ENEMIES[+p[2]]};
   case"tr":case"ts":case"hs":return{k:"b",h:HB(p[1]),e:ENEMIES[hs(id)%10]};case"pi":return{k:"b",h:HB(p[1]),e:ENEMIES[8]};
   case"f":case"cb":return{k:"f",f:FK(p[1])};case"pa":return{k:"f",f:FOODS[(+p[1]*2)%8]};case"fe":return{k:"f",f:FOODS[[6,3,0][+p[1]]]};case"st":return{k:"f",f:FK("curry")};
   case"gh":return{k:"b",h:HB("magic"),e:ENEMIES[6]};case"se":return{k:"b",h:HB("cat"),e:ENEMIES[8]};case"dn":return{k:"b",h:HB("dino"),e:ENEMIES[5]};case"rf":return{k:"b",h:HB("robot"),e:ENEMIES[3]};case"mg":return{k:"b",h:HB("magic"),e:ENEMIES[0]};case"sn":return{k:"b",h:HB("fire"),e:ENEMIES[1]};case"fc":return{k:"b",h:HB("unchi"),e:ENEMIES[0]};
   case"s":return{k:"t",v:VEHICLES[+p[1]],d:DESTS[+p[2]]};case"ol":return{k:"r",rs:[RACERS[3],RACERS[4],RACERS[5]],win:RACERS[3+(+p[1])%3]};
   case"qz":return{k:"q",th:Object.keys(QUIZ)[+p[1]]};case"kb":return{k:"k",g:p[1]};case"dw":return{k:"d",f:FOODS[+p[1]]}}
  return null}

      const sc=v.scenes[si],lt=el-sc.at,p=lt/sc.d;

function renderWho(){document.querySelectorAll("#who button").forEach(b=>b.classList.toggle("on",b.dataset.n===WHO))}
$("who").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;WHO=b.dataset.n;try{localStorage.setItem("kanyo-who",WHO)}catch(e){}renderWho()});
renderWho();renderChips();renderMenu();renderSub();resize();
(document.fonts?document.fonts.load(`40px "Dela Gothic One"`):Promise.resolve()).catch(()=>{}).finally(()=>requestAnimationFrame(loop));
